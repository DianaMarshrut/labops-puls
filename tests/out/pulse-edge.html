<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Пульс</title>
<!--
  Pulse dashboard template (labopsai capsule "puls").
  Self-contained: no external fonts, scripts, images or network requests.
  The Content-Security-Policy meta blocks any network load even if data is malformed.
  NEVER put links with keys (Bitrix24 webhook /rest/<id>/<key>/) into the JSON: the page source
  is readable by anyone who gets the file. On screen such a key is masked as a last guard.

  HOW TO FILL: edit ONLY the JSON inside <script id="puls-data">. Do not touch CSS/JS.
  ESCAPING: inside JSON strings write every "<" as \u003c, so text like </script> cannot
  close this block early. The renderer uses textContent only, so no string is ever run as HTML.
  - meta.company, meta.period, meta.built_at, meta.source: plain strings.
  - kpis: 3-7 items. value = ready-to-show string ("1 250 000 ₽", "нет данных").
      delta_pct = number (12.5 / -8) or null when there is nothing to compare with.
      better = "up" if growth is good (revenue), "down" if growth is bad (overdue, debts).
      compare_to = what the delta is against ("прошлой неделе", "плану").
      delta_unit = optional, default "%"; use " п.п." for a change of a share (conversion).
      note = optional short caption.
  - charts: 0-2 items. type "bar" or "line"; points = [{label, value}] with numeric values;
      unit = suffix for tooltips/axis ("₽", "шт", "%").
  - charts: a point with value null is a period with no data: it keeps its label and shows "н/д".
  - tables: 0-2 items. columns = header strings; rows = arrays of strings;
      num_cols = indexes of numeric columns (right-aligned).
      empty_note = optional text shown when rows is empty (default "нет данных").
  - attention: 1-3 strings, only what is visible in the data.
-->
<style>
  :root{
    --bg:#F4F6FA; --card:#FFFFFF; --text:#14171A; --muted:#5B6670; --border:#E2E7EE;
    --grid:#EDF0F4; --accent:#4F6BED; --accent-soft:#E8ECFD;
    --good:#15803D; --good-bg:#E7F6EC; --bad:#B91C1C; --bad-bg:#FDECEC;
    --flat:#5B6670; --flat-bg:#EEF1F5;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 16px}
  .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{margin:2px 0 0;font-size:26px;line-height:1.2;overflow-wrap:anywhere}
  .period{color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:20px 0}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;min-width:0}
  .kpi .label{color:var(--muted);font-size:13px;font-weight:500}
  .kpi .value{font-size:28px;font-weight:700;margin:4px 0 6px;line-height:1.15;
              font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .kpi .value.empty{font-size:20px;color:var(--muted);font-weight:600}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;
         padding:2px 8px;border-radius:999px}
  .delta.good{color:var(--good);background:var(--good-bg)}
  .delta.bad{color:var(--bad);background:var(--bad-bg)}
  .delta.flat{color:var(--flat);background:var(--flat-bg)}
  .kpi .note{color:var(--muted);font-size:12px;margin-top:6px}
  section{background:var(--card);border:1px solid var(--border);border-radius:16px;
          padding:16px;margin:12px 0;min-width:0}
  h2{font-size:17px;margin:0 0 10px}
  .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
  .row2 section{margin:0}
  .chart{position:relative}
  .chart svg{display:block;max-width:100%;height:220px;overflow:visible}
  .chart .tip{position:absolute;pointer-events:none;background:var(--text);color:#fff;
              font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;
              transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
  .chart .tip.on{opacity:1}
  .axis{fill:var(--muted);font-size:11px}
  details{margin-top:8px;font-size:13px;color:var(--muted)}
  details summary{cursor:pointer}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:13px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .attention ul{margin:0;padding-left:20px}
  .attention li{margin:4px 0}
  footer{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
  footer b{color:var(--text);font-weight:600}
  @media (max-width:520px){
    h1{font-size:22px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .kpi{padding:12px}
    .kpi .value{font-size:22px}
    .row2{grid-template-columns:1fr}
  }
  @media (max-width:340px){ .grid{grid-template-columns:1fr} }
  @media print{ body{background:#fff} .chart .tip{display:none} }
</style>
</head>
<body>

<script>
(function () {
  "use strict";
  // Last guard only: masks the key of ".../rest/<id>/<key>/..." links on screen.
  // The key would still be in this file's source, so never put it into the JSON at all.
  function safe(v) {
    return String(v).replace(/(\/rest\/\d+\/)[^\/\s?#]+/gi, "$1***");
  }
  var data;
  var app = document.getElementById("app");
  try {
    data = JSON.parse(document.getElementById("puls-data").textContent);
  } catch (e) {
    var err = document.createElement("p");
    err.textContent = safe("Ошибка в данных дашборда: " + String(e.message));
    app.appendChild(err);
    return;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = safe(text);
    return n;
  }
  var nf = new Intl.NumberFormat("ru-RU", {maximumFractionDigits: 1});
  function fmt(v, unit) { return nf.format(v) + (unit ? " " + unit : ""); }
  function short(v) {
    var a = Math.abs(v);
    if (a >= 1e9) return nf.format(v / 1e9) + " млрд";
    if (a >= 1e6) return nf.format(v / 1e6) + " млн";
    if (a >= 1e4) return nf.format(v / 1e3) + " тыс";
    return nf.format(v);
  }

  var meta = data.meta || {};
  document.title = safe("Пульс — " + (meta.company || ""));

  // Header
  var head = el("header");
  var left = el("div");
  left.appendChild(el("div", "eyebrow", "Пульс"));
  left.appendChild(el("h1", null, meta.company || ""));
  head.appendChild(left);
  head.appendChild(el("div", "period", meta.period || ""));
  app.appendChild(head);

  // KPI cards
  var grid = el("div", "grid");
  (data.kpis || []).forEach(function (k) {
    var c = el("div", "kpi");
    c.appendChild(el("div", "label", k.label));
    var empty = !k.value || /нет данных/i.test(k.value);
    c.appendChild(el("div", "value" + (empty ? " empty" : ""), k.value || "нет данных"));
    if (typeof k.delta_pct === "number" && isFinite(k.delta_pct)) {
      var d = k.delta_pct, kind, arrow;
      if (Math.abs(d) < 0.05) { kind = "flat"; arrow = "■"; }
      else {
        var goodWhenUp = k.better !== "down";
        kind = (d > 0) === goodWhenUp ? "good" : "bad";
        arrow = d > 0 ? "▲" : "▼";
      }
      var txt = arrow + " " + (d > 0 ? "+" : "") + nf.format(d) + (k.delta_unit || "%") +
                (k.compare_to ? " к " + k.compare_to : "");
      c.appendChild(el("span", "delta " + kind, txt));
    }
    if (k.note) c.appendChild(el("div", "note", k.note));
    grid.appendChild(c);
  });
  app.appendChild(grid);

  // Charts (single series each; bar or line; inline SVG; hover/tap tooltip)
  var SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    for (var a in attrs) n.setAttribute(a, attrs[a]);
    return n;
  }
  var drawers = [];
  function chart(cfg) {
    var sec = el("section");
    sec.appendChild(el("h2", null, cfg.title));
    var pts = cfg.points || [];
    function num(p) { return typeof p.value === "number" && isFinite(p.value); }
    if (!pts.some(num)) { sec.appendChild(el("p", "period", "нет данных")); return sec; }
    var box = el("div", "chart");
    var tip = el("div", "tip");
    sec.appendChild(box);
    function draw() {
      box.innerHTML = "";
      var W = Math.max(240, Math.round(box.clientWidth || 600)), H = 220;
      var padL = 52, padR = 8, padT = 12;
      var stepGuess = (W - padL - padR) / pts.length;
      var longest = Math.max.apply(null, pts.map(function (p) { return String(p.label).length; }));
      var twoLines = longest * 6.2 > stepGuess - 4;
      var padB = twoLines ? 40 : 28;
      var svg = s("svg", {viewBox: "0 0 " + W + " " + H, width: W, height: H,
                          role: "img", "aria-label": safe(cfg.title)});
      var vals = pts.filter(num).map(function (p) { return p.value; });
      var max = Math.max(0, Math.max.apply(null, vals));
      var min = Math.min(0, Math.min.apply(null, vals));
      if (max === min) max = min + 1;
      var iw = W - padL - padR, ih = H - padT - padB;
      function y(v) { return padT + ih - (v - min) / (max - min) * ih; }
      for (var g = 0; g <= 4; g++) {
        var gv = min + (max - min) * g / 4, gy = y(gv);
        svg.appendChild(s("line", {x1: padL, x2: W - padR, y1: gy, y2: gy,
                                   stroke: "#EDF0F4", "stroke-width": 1}));
        var t = s("text", {x: padL - 6, y: gy + 4, "text-anchor": "end", "class": "axis"});
        t.textContent = short(gv);
        svg.appendChild(t);
      }
      var step = iw / pts.length;
      function parts(lbl) {
        lbl = String(lbl);
        if (!twoLines) return [lbl];
        var m = lbl.match(/^(.+?)([–\- ])(.+)$/);
        return m ? [m[1] + (m[2] === " " ? "" : m[2]), m[3]] : [lbl];
      }
      var widest = Math.max.apply(null, pts.map(function (p) {
        return Math.max.apply(null, parts(p.label).map(function (x) { return x.length; }));
      })) * 6.2 + 6;
      var every = Math.max(1, Math.ceil(widest / step));
      var linePts = [], lines = [], marks = [], hits = [];
      pts.forEach(function (p, i) {
        var cx = padL + step * i + step / 2;
        if (i % every === 0) {
          var ps = parts(p.label);
          ps.forEach(function (line, li) {
            var lt = s("text", {x: cx, y: H - padB + 16 + li * 13, "text-anchor": "middle",
                                "class": "axis"});
            lt.textContent = safe(line);
            svg.appendChild(lt);
          });
        }
        var tipText = p.label + ": " + (num(p) ? fmt(p.value, cfg.unit) : "нет данных");
        var tipY = num(p) ? y(p.value) : y(0);
        if (!num(p)) {
          var nd = s("text", {x: cx, y: y(0) - 6, "text-anchor": "middle", "class": "axis"});
          nd.textContent = "н/д";
          marks.push(nd);
          if (cfg.type === "line" && linePts.length) { lines.push(linePts); linePts = []; }
        } else if (cfg.type === "line") {
          linePts.push(cx + "," + y(p.value));
          marks.push(s("circle", {cx: cx, cy: y(p.value), r: 4, fill: "#4F6BED",
                                  stroke: "#fff", "stroke-width": 2}));
        } else {
          var bw = Math.max(4, Math.min(48, step - 6));
          var top = y(Math.max(p.value, 0)), h = Math.max(1, Math.abs(y(0) - y(p.value)));
          marks.push(s("rect", {x: cx - bw / 2, y: top, width: bw, height: h, rx: 4,
                                fill: "#4F6BED"}));
        }
        var hit = s("rect", {x: padL + step * i, y: padT, width: step, height: ih,
                             fill: "transparent", tabindex: 0});
        hit.setAttribute("aria-label", safe(tipText));
        function show() {
          tip.textContent = safe(tipText);
          tip.style.left = cx + "px";
          tip.style.top = tipY + "px";
          tip.classList.add("on");
        }
        function hide() { tip.classList.remove("on"); }
        hit.addEventListener("mouseenter", show);
        hit.addEventListener("focus", show);
        hit.addEventListener("touchstart", show, {passive: true});
        hit.addEventListener("mouseleave", hide);
        hit.addEventListener("blur", hide);
        hits.push(hit);
      });
      if (cfg.type === "line") {
        if (linePts.length) lines.push(linePts);
        lines.forEach(function (lp) {
          svg.appendChild(s("polyline", {points: lp.join(" "), fill: "none",
            stroke: "#4F6BED", "stroke-width": 2, "stroke-linejoin": "round"}));
        });
      }
      marks.forEach(function (m) { svg.appendChild(m); });
      hits.forEach(function (h) { svg.appendChild(h); });
      box.appendChild(svg);
      box.appendChild(tip);
    }
    drawers.push(draw);
    // Table view of the same numbers (accessibility, copy-paste)
    var det = el("details");
    det.appendChild(el("summary", null, "Показать цифры таблицей"));
    det.appendChild(table({columns: ["", cfg.unit ? "Значение, " + cfg.unit : "Значение"],
      num_cols: [1], rows: pts.map(function (p) {
        return [p.label, num(p) ? nf.format(p.value) : "нет данных"];
      })}));
    sec.appendChild(det);
    return sec;
  }

  function table(cfg) {
    var wrap = el("div", "tscroll");
    var tb = el("table");
    var nums = cfg.num_cols || [];
    var tr = el("tr");
    (cfg.columns || []).forEach(function (c, i) {
      tr.appendChild(el("th", nums.indexOf(i) >= 0 ? "num" : null, c));
    });
    tb.appendChild(tr);
    if (!(cfg.rows || []).length) {
      var er = el("tr"), td = el("td", null, cfg.empty_note || "нет данных");
      td.colSpan = Math.max(1, (cfg.columns || []).length);
      er.appendChild(td);
      tb.appendChild(er);
    }
    (cfg.rows || []).forEach(function (r) {
      var row = el("tr");
      r.forEach(function (c, i) { row.appendChild(el("td", nums.indexOf(i) >= 0 ? "num" : null, c)); });
      tb.appendChild(row);
    });
    wrap.appendChild(tb);
    return wrap;
  }

  var charts = data.charts || [];
  if (charts.length) {
    var row = el("div", charts.length > 1 ? "row2" : null);
    charts.forEach(function (c) { row.appendChild(chart(c)); });
    app.appendChild(row);
  }
  (data.tables || []).forEach(function (t) {
    var sec = el("section");
    sec.appendChild(el("h2", null, t.title));
    sec.appendChild(table(t));
    app.appendChild(sec);
  });
  if ((data.attention || []).length) {
    var at = el("section", "attention");
    at.appendChild(el("h2", null, "На что обратить внимание"));
    var ul = el("ul");
    data.attention.forEach(function (a) { ul.appendChild(el("li", null, a)); });
    at.appendChild(ul);
    app.appendChild(at);
  }
  drawers.forEach(function (d) { d(); });
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { drawers.forEach(function (d) { d(); }); }, 150);
  });
  var f = el("footer");
  f.appendChild(document.createTextNode(safe("Собрано: " + (meta.built_at || "") +
    " · Источник: " + (meta.source || "") + " · Чтобы обновить цифры, напиши ИИ: ")));
  f.appendChild(el("b", null, "«обнови пульс»"));
  app.appendChild(f);
})();
</script>
</body>
